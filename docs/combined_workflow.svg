<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Combined Analysis to Trade Workflow</title>
  <desc id="desc">Combined LangGraph workflow from analysis through evaluator, report approval, publish, trade creation, Guardian policy, optional compliance approval, execution, and end states.</desc>
  <defs>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .bg { fill: #f8fafc; }
      .title { fill: #0f172a; font-size: 24px; font-weight: 700; }
      .subtitle { fill: #475569; font-size: 13px; }
      .lane-title { font-size: 14px; font-weight: 800; letter-spacing: .02em; }
      .label { fill: #0f172a; font-size: 13px; font-weight: 800; }
      .small { fill: #475569; font-size: 11px; }
      .tiny { fill: #64748b; font-size: 10px; }
      .node { fill: #ffffff; stroke-width: 2; }
      .edge { fill: none; stroke: #64748b; stroke-width: 2.4; }
      .deep { fill: none; stroke: #7c3aed; stroke-width: 2.4; }
      .flash { fill: none; stroke: #0f766e; stroke-width: 2.4; }
      .approve { fill: none; stroke: #059669; stroke-width: 2.4; }
      .hitl { fill: none; stroke: #be185d; stroke-width: 2.4; stroke-dasharray: 7 5; }
      .reject { fill: none; stroke: #dc2626; stroke-width: 2.4; stroke-dasharray: 7 5; }
    </style>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,7 L10,3.5 z" fill="#64748b"/>
    </marker>
    <marker id="arrowDeep" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,7 L10,3.5 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrowFlash" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,7 L10,3.5 z" fill="#0f766e"/>
    </marker>
    <marker id="arrowGreen" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,7 L10,3.5 z" fill="#059669"/>
    </marker>
    <marker id="arrowPink" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,7 L10,3.5 z" fill="#be185d"/>
    </marker>
    <marker id="arrowRed" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,7 L10,3.5 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect class="bg" width="1280" height="720"/>
  <text class="title" x="640" y="38" text-anchor="middle">Combined Workflow: Analysis to Simulated Trade</text>
  <text class="subtitle" x="640" y="61" text-anchor="middle">The combined graph reuses analysis nodes, pauses for report approval, creates a trade only for buy/sell recommendations, then applies Guardian policy.</text>

  <rect x="34" y="96" width="742" height="414" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text class="lane-title" x="405" y="124" fill="#334155" text-anchor="middle">ANALYSIS PHASE</text>
  <rect x="252" y="145" width="414" height="126" rx="12" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/>
  <text class="lane-title" x="459" y="169" fill="#5b21b6" text-anchor="middle">DEEP RESEARCH</text>
  <rect x="252" y="330" width="414" height="126" rx="12" fill="#ecfdf5" stroke="#5eead4" stroke-width="2"/>
  <text class="lane-title" x="459" y="354" fill="#0f766e" text-anchor="middle">FLASH BRIEFING</text>

  <rect x="820" y="96" width="426" height="544" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text class="lane-title" x="1033" y="124" fill="#334155" text-anchor="middle">TRADE PHASE</text>

  <g filter="url(#shadow)">
    <rect x="62" y="271" width="80" height="52" rx="26" fill="#2563eb"/>
    <text x="102" y="303" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">START</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="168" y="266" width="84" height="62" rx="10" fill="#7c3aed"/>
    <text x="210" y="303" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">Router</text>
  </g>

  <g filter="url(#shadow)">
    <rect class="node" x="284" y="189" width="92" height="48" rx="8" stroke="#8b5cf6"/>
    <text class="label" x="330" y="218" text-anchor="middle">Planner</text>
  </g>
  <g filter="url(#shadow)">
    <rect class="node" x="413" y="189" width="92" height="48" rx="8" stroke="#8b5cf6"/>
    <text class="label" x="459" y="218" text-anchor="middle">Executor</text>
  </g>
  <g filter="url(#shadow)">
    <rect class="node" x="542" y="189" width="92" height="48" rx="8" stroke="#8b5cf6"/>
    <text class="label" x="588" y="218" text-anchor="middle">Reporter</text>
  </g>

  <g filter="url(#shadow)">
    <rect class="node" x="284" y="374" width="92" height="48" rx="8" stroke="#14b8a6"/>
    <text class="label" x="330" y="403" text-anchor="middle">Planner</text>
  </g>
  <g filter="url(#shadow)">
    <rect class="node" x="413" y="374" width="92" height="48" rx="8" stroke="#14b8a6"/>
    <text class="label" x="459" y="403" text-anchor="middle">Worker</text>
  </g>
  <g filter="url(#shadow)">
    <rect class="node" x="542" y="374" width="92" height="48" rx="8" stroke="#14b8a6"/>
    <text class="label" x="588" y="403" text-anchor="middle">Solver</text>
  </g>

  <g filter="url(#shadow)">
    <rect class="node" x="690" y="266" width="84" height="62" rx="10" stroke="#0284c7"/>
    <text class="label" x="732" y="291" text-anchor="middle">Evaluator</text>
    <text class="tiny" x="732" y="310" text-anchor="middle">default-fail</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="842" y="162" width="130" height="58" rx="10" fill="#be185d"/>
    <text x="907" y="187" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">Publish</text>
    <text x="907" y="206" font-size="10" fill="#fce7f3" text-anchor="middle">report HITL</text>
  </g>

  <g filter="url(#shadow)">
    <rect class="node" x="842" y="266" width="130" height="62" rx="10" stroke="#d97706"/>
    <text class="label" x="907" y="291" text-anchor="middle">Create Trade</text>
    <text class="tiny" x="907" y="310" text-anchor="middle">buy/sell only</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="842" y="388" width="130" height="58" rx="10" fill="#475569"/>
    <text x="907" y="412" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">No Trade</text>
    <text x="907" y="431" font-size="10" fill="#e2e8f0" text-anchor="middle">hold recommendation</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1030" y="266" width="126" height="62" rx="10" fill="#0284c7"/>
    <text x="1093" y="291" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">Guardian</text>
    <text x="1093" y="310" font-size="10" fill="#e0f2fe" text-anchor="middle">policy check</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1030" y="162" width="126" height="58" rx="10" fill="#be185d"/>
    <text x="1093" y="187" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">Compliance</text>
    <text x="1093" y="206" font-size="10" fill="#fce7f3" text-anchor="middle">trade HITL</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1030" y="388" width="126" height="58" rx="10" fill="#dc2626"/>
    <text x="1093" y="413" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">Rejected</text>
    <text x="1093" y="432" font-size="10" fill="#fee2e2" text-anchor="middle">blocked by policy</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1100" y="506" width="126" height="58" rx="10" fill="#059669"/>
    <text x="1163" y="531" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">Execute</text>
    <text x="1163" y="550" font-size="10" fill="#dcfce7" text-anchor="middle">simulated trade</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="922" y="556" width="94" height="54" rx="27" fill="#475569"/>
    <text x="969" y="589" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">END</text>
  </g>

  <line x1="142" y1="297" x2="163" y2="297" stroke="#64748b" stroke-width="2.4"/>
  <polygon points="163,297 153,292 153,302" fill="#64748b"/>
  <line x1="252" y1="284" x2="279" y2="213" stroke="#7c3aed" stroke-width="2.4"/>
  <polygon points="279,213 268,208 270,220" fill="#7c3aed"/>
  <line x1="252" y1="310" x2="279" y2="398" stroke="#0f766e" stroke-width="2.4"/>
  <polygon points="279,398 268,391 267,404" fill="#0f766e"/>
  <line x1="376" y1="213" x2="408" y2="213" stroke="#7c3aed" stroke-width="2.4"/>
  <polygon points="408,213 398,208 398,218" fill="#7c3aed"/>
  <line x1="505" y1="213" x2="537" y2="213" stroke="#7c3aed" stroke-width="2.4"/>
  <polygon points="537,213 527,208 527,218" fill="#7c3aed"/>
  <line x1="376" y1="398" x2="408" y2="398" stroke="#0f766e" stroke-width="2.4"/>
  <polygon points="408,398 398,393 398,403" fill="#0f766e"/>
  <line x1="505" y1="398" x2="537" y2="398" stroke="#0f766e" stroke-width="2.4"/>
  <polygon points="537,398 527,393 527,403" fill="#0f766e"/>
  <line x1="634" y1="213" x2="685" y2="286" stroke="#64748b" stroke-width="2.4"/>
  <polygon points="685,286 674,280 673,292" fill="#64748b"/>
  <line x1="634" y1="398" x2="685" y2="308" stroke="#64748b" stroke-width="2.4"/>
  <polygon points="685,308 672,313 676,301" fill="#64748b"/>

  <line x1="774" y1="297" x2="800" y2="297" stroke="#be185d" stroke-width="2.4" stroke-dasharray="7 5"/>
  <line x1="800" y1="297" x2="800" y2="191" stroke="#be185d" stroke-width="2.4" stroke-dasharray="7 5"/>
  <line x1="800" y1="191" x2="837" y2="191" stroke="#be185d" stroke-width="2.4" stroke-dasharray="7 5"/>
  <polygon points="837,191 827,186 827,196" fill="#be185d"/>
  <text class="tiny" x="803" y="176" fill="#be185d" text-anchor="middle">interrupt_before publish</text>
  <line x1="907" y1="220" x2="907" y2="261" stroke="#64748b" stroke-width="2.4"/>
  <polygon points="907,261 902,251 912,251" fill="#64748b"/>
  <line x1="972" y1="297" x2="1025" y2="297" stroke="#059669" stroke-width="2.4"/>
  <polygon points="1025,297 1015,292 1015,302" fill="#059669"/>
  <text class="tiny" x="999" y="285" fill="#047857" text-anchor="middle">trade exists</text>
  <line x1="907" y1="328" x2="907" y2="383" stroke="#64748b" stroke-width="2.4"/>
  <polygon points="907,383 902,373 912,373" fill="#64748b"/>
  <text class="tiny" x="927" y="359" text-anchor="middle">hold</text>
  <line x1="907" y1="446" x2="907" y2="583" stroke="#64748b" stroke-width="2.4"/>
  <line x1="907" y1="583" x2="917" y2="583" stroke="#64748b" stroke-width="2.4"/>
  <polygon points="917,583 907,578 907,588" fill="#64748b"/>

  <line x1="1156" y1="297" x2="1196" y2="297" stroke="#059669" stroke-width="2.4"/>
  <line x1="1196" y1="297" x2="1196" y2="501" stroke="#059669" stroke-width="2.4"/>
  <polygon points="1196,501 1191,491 1201,491" fill="#059669"/>
  <text class="tiny" x="1202" y="390" fill="#047857">approve</text>
  <line x1="1093" y1="266" x2="1093" y2="225" stroke="#be185d" stroke-width="2.4" stroke-dasharray="7 5"/>
  <polygon points="1093,225 1088,235 1098,235" fill="#be185d"/>
  <text class="tiny" x="1119" y="247" fill="#be185d">escalate</text>
  <line x1="1156" y1="191" x2="1196" y2="191" stroke="#be185d" stroke-width="2.4" stroke-dasharray="7 5"/>
  <line x1="1196" y1="191" x2="1196" y2="501" stroke="#be185d" stroke-width="2.4" stroke-dasharray="7 5"/>
  <polygon points="1196,501 1191,491 1201,491" fill="#be185d"/>
  <text class="tiny" x="1172" y="178" fill="#be185d">human approves</text>
  <line x1="1093" y1="328" x2="1093" y2="383" stroke="#dc2626" stroke-width="2.4" stroke-dasharray="7 5"/>
  <polygon points="1093,383 1088,373 1098,373" fill="#dc2626"/>
  <text class="tiny" x="1117" y="360" fill="#dc2626">reject</text>
  <line x1="1163" y1="564" x2="1163" y2="583" stroke="#64748b" stroke-width="2.4"/>
  <line x1="1163" y1="583" x2="1021" y2="583" stroke="#64748b" stroke-width="2.4"/>
  <polygon points="1021,583 1031,578 1031,588" fill="#64748b"/>
  <line x1="1030" y1="417" x2="969" y2="417" stroke="#dc2626" stroke-width="2.4" stroke-dasharray="7 5"/>
  <line x1="969" y1="417" x2="969" y2="551" stroke="#dc2626" stroke-width="2.4" stroke-dasharray="7 5"/>
  <polygon points="969,551 964,541 974,541" fill="#dc2626"/>

  <rect x="34" y="664" width="1212" height="34" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text class="tiny" x="640" y="685" text-anchor="middle">Compile-time interrupts: before publish for report approval, before compliance_officer for escalated trades. A hold report ends after create_trade with no Guardian call.</text>
</svg>
