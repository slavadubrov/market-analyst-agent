<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 500" role="img" aria-labelledby="title desc">
  <title id="title">Trade Workflow</title>
  <desc id="desc">Guardian trade workflow with auto-approve, human escalation, rejection, compliance officer interrupt, idempotent trade execution, and end states.</desc>
  <defs>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .bg { fill: #f8fafc; }
      .title { fill: #0f172a; font-size: 24px; font-weight: 700; }
      .subtitle { fill: #475569; font-size: 13px; }
      .node-label { fill: #0f172a; font-size: 14px; font-weight: 700; }
      .small { fill: #475569; font-size: 11px; }
      .tiny { fill: #64748b; font-size: 10px; }
      .edge { fill: none; stroke: #64748b; stroke-width: 2.5; }
      .approve { fill: none; stroke: #059669; stroke-width: 2.5; }
      .escalate { fill: none; stroke: #be185d; stroke-width: 2.5; stroke-dasharray: 7 5; }
      .reject { fill: none; stroke: #dc2626; stroke-width: 2.5; stroke-dasharray: 7 5; }
    </style>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,7 L10,3.5 z" fill="#64748b"/>
    </marker>
    <marker id="arrowGreen" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,7 L10,3.5 z" fill="#059669"/>
    </marker>
    <marker id="arrowPink" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,7 L10,3.5 z" fill="#be185d"/>
    </marker>
    <marker id="arrowRed" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,7 L10,3.5 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect class="bg" width="980" height="500"/>
  <text class="title" x="490" y="38" text-anchor="middle">Trade Workflow: Guardian Pattern</text>
  <text class="subtitle" x="490" y="61" text-anchor="middle">A deterministic policy node validates the pending trade before simulated execution.</text>

  <g filter="url(#shadow)">
    <rect x="42" y="220" width="126" height="60" rx="30" fill="#2563eb"/>
    <text x="105" y="245" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">Trade</text>
    <text x="105" y="264" font-size="12" fill="#dbeafe" text-anchor="middle">Request</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="246" y="207" width="144" height="86" rx="12" fill="#0284c7"/>
    <text x="318" y="239" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">Guardian</text>
    <text x="318" y="260" font-size="12" fill="#e0f2fe" text-anchor="middle">policy-as-code</text>
    <text x="318" y="278" font-size="11" fill="#bae6fd" text-anchor="middle">approve / escalate / reject</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="520" y="76" width="160" height="66" rx="10" fill="#be185d"/>
    <text x="600" y="103" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">Compliance Officer</text>
    <text x="600" y="123" font-size="11" fill="#fce7f3" text-anchor="middle">HITL interrupt point</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="520" y="220" width="160" height="60" rx="10" fill="#059669"/>
    <text x="600" y="245" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">Execute Trade</text>
    <text x="600" y="264" font-size="11" fill="#dcfce7" text-anchor="middle">simulated + idempotent</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="520" y="358" width="160" height="60" rx="10" fill="#dc2626"/>
    <text x="600" y="383" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">Rejected</text>
    <text x="600" y="402" font-size="11" fill="#fee2e2" text-anchor="middle">restricted action</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="804" y="220" width="98" height="60" rx="30" fill="#475569"/>
    <text x="853" y="256" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">END</text>
  </g>

  <line x1="168" y1="250" x2="241" y2="250" stroke="#64748b" stroke-width="2.5"/>
  <polygon points="241,250 231,245 231,255" fill="#64748b"/>

  <line x1="390" y1="250" x2="515" y2="250" stroke="#059669" stroke-width="2.5"/>
  <polygon points="515,250 505,245 505,255" fill="#059669"/>
  <text x="455" y="231" font-size="12" font-weight="800" fill="#047857" text-anchor="middle">APPROVE</text>
  <text class="small" x="455" y="268" text-anchor="middle">amount &lt;= $500</text>

  <line x1="362" y1="207" x2="430" y2="109" stroke="#be185d" stroke-width="2.5" stroke-dasharray="7 5"/>
  <line x1="430" y1="109" x2="515" y2="109" stroke="#be185d" stroke-width="2.5" stroke-dasharray="7 5"/>
  <polygon points="515,109 505,104 505,114" fill="#be185d"/>
  <text x="434" y="91" font-size="12" font-weight="800" fill="#be185d" text-anchor="middle">ESCALATE</text>
  <text class="small" x="438" y="126" text-anchor="middle">$500 &lt; amount, including &gt; $10k</text>
  <line x1="680" y1="109" x2="740" y2="109" stroke="#be185d" stroke-width="2.5" stroke-dasharray="7 5"/>
  <line x1="740" y1="109" x2="740" y2="240" stroke="#be185d" stroke-width="2.5" stroke-dasharray="7 5"/>
  <line x1="740" y1="240" x2="685" y2="240" stroke="#be185d" stroke-width="2.5" stroke-dasharray="7 5"/>
  <polygon points="685,240 695,235 695,245" fill="#be185d"/>
  <text class="tiny" x="738" y="96" fill="#be185d" text-anchor="middle">human approves</text>

  <line x1="362" y1="293" x2="430" y2="388" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="7 5"/>
  <line x1="430" y1="388" x2="515" y2="388" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="7 5"/>
  <polygon points="515,388 505,383 505,393" fill="#dc2626"/>
  <text x="435" y="409" font-size="12" font-weight="800" fill="#dc2626" text-anchor="middle">REJECT</text>
  <text class="small" x="441" y="372" text-anchor="middle">delete_portfolio / delete_logs</text>

  <line x1="680" y1="250" x2="799" y2="250" stroke="#64748b" stroke-width="2.5"/>
  <polygon points="799,250 789,245 789,255" fill="#64748b"/>
  <line x1="680" y1="388" x2="738" y2="388" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="7 5"/>
  <line x1="738" y1="388" x2="738" y2="270" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="7 5"/>
  <line x1="738" y1="270" x2="799" y2="270" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="7 5"/>
  <polygon points="799,270 789,265 789,275" fill="#dc2626"/>

  <rect x="42" y="438" width="896" height="34" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text class="tiny" x="490" y="459" text-anchor="middle">Policy thresholds in guardian.py: safe_path &lt;= $500, default review for $500-$10k, high_value_threshold &gt; $10k, restricted actions rejected.</text>
</svg>
