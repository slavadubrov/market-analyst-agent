<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 640" role="img" aria-labelledby="title desc">
  <title id="title">Analysis Workflow</title>
  <desc id="desc">LangGraph analysis workflow with router, deep ReAct path, flash ReWOO path, evaluator, human approval interrupt, and publish node.</desc>
  <defs>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .bg { fill: #f8fafc; }
      .title { fill: #0f172a; font-size: 24px; font-weight: 700; }
      .subtitle { fill: #475569; font-size: 13px; }
      .lane-title { font-size: 14px; font-weight: 700; letter-spacing: .02em; }
      .label { fill: #0f172a; font-size: 14px; font-weight: 700; }
      .small { fill: #475569; font-size: 11px; }
      .tiny { fill: #64748b; font-size: 10px; }
      .node { fill: #ffffff; stroke-width: 2; }
      .pill { stroke-width: 0; }
      .edge { fill: none; stroke: #64748b; stroke-width: 2.5; }
      .deep-edge { fill: none; stroke: #7c3aed; stroke-width: 2.5; }
      .flash-edge { fill: none; stroke: #0f766e; stroke-width: 2.5; }
      .tool-edge { fill: none; stroke: #d97706; stroke-width: 2.5; stroke-dasharray: 7 5; }
      .hitl-edge { fill: none; stroke: #be185d; stroke-width: 2.5; stroke-dasharray: 7 5; }
    </style>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,7 L10,3.5 z" fill="#64748b"/>
    </marker>
    <marker id="arrowDeep" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,7 L10,3.5 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrowFlash" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,7 L10,3.5 z" fill="#0f766e"/>
    </marker>
    <marker id="arrowTool" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,7 L10,3.5 z" fill="#d97706"/>
    </marker>
    <marker id="arrowHitl" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,7 L10,3.5 z" fill="#be185d"/>
    </marker>
  </defs>

  <rect class="bg" width="1180" height="640"/>
  <text class="title" x="590" y="38" text-anchor="middle">Analysis Workflow</text>
  <text class="subtitle" x="590" y="61" text-anchor="middle">Router selects a reasoning loop, both paths converge on a fresh-context evaluator, then pause before publish for human approval.</text>

  <rect x="245" y="92" width="560" height="164" rx="14" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/>
  <text class="lane-title" x="525" y="119" fill="#5b21b6" text-anchor="middle">DEEP RESEARCH: PLAN-AND-EXECUTE + REACT</text>

  <rect x="245" y="332" width="560" height="164" rx="14" fill="#ecfdf5" stroke="#5eead4" stroke-width="2"/>
  <text class="lane-title" x="525" y="359" fill="#0f766e" text-anchor="middle">FLASH BRIEFING: REWOO</text>

  <g filter="url(#shadow)">
    <rect class="pill" x="42" y="274" width="92" height="52" rx="26" fill="#2563eb"/>
    <text x="88" y="306" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">START</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="170" y="270" width="104" height="60" rx="10" fill="#7c3aed"/>
    <text x="222" y="306" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">Router</text>
  </g>

  <g filter="url(#shadow)">
    <rect class="node" x="305" y="146" width="118" height="58" rx="9" stroke="#8b5cf6"/>
    <text class="label" x="364" y="171" text-anchor="middle">Planner</text>
    <text class="small" x="364" y="190" text-anchor="middle">build step plan</text>
  </g>
  <g filter="url(#shadow)">
    <rect class="node" x="476" y="146" width="118" height="58" rx="9" stroke="#8b5cf6"/>
    <text class="label" x="535" y="171" text-anchor="middle">Executor</text>
    <text class="small" x="535" y="190" text-anchor="middle">ReAct loop</text>
  </g>
  <g filter="url(#shadow)">
    <rect class="node" x="647" y="146" width="118" height="58" rx="9" stroke="#8b5cf6"/>
    <text class="label" x="706" y="171" text-anchor="middle">Reporter</text>
    <text class="small" x="706" y="190" text-anchor="middle">draft report</text>
  </g>

  <g filter="url(#shadow)">
    <rect class="node" x="305" y="386" width="118" height="58" rx="9" stroke="#14b8a6"/>
    <text class="label" x="364" y="411" text-anchor="middle">Planner</text>
    <text class="small" x="364" y="430" text-anchor="middle">all tool calls</text>
  </g>
  <g filter="url(#shadow)">
    <rect class="node" x="476" y="386" width="118" height="58" rx="9" stroke="#14b8a6"/>
    <text class="label" x="535" y="411" text-anchor="middle">Worker</text>
    <text class="small" x="535" y="430" text-anchor="middle">parallel execute</text>
  </g>
  <g filter="url(#shadow)">
    <rect class="node" x="647" y="386" width="118" height="58" rx="9" stroke="#14b8a6"/>
    <text class="label" x="706" y="411" text-anchor="middle">Solver</text>
    <text class="small" x="706" y="430" text-anchor="middle">synthesize</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="348" y="520" width="354" height="74" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text class="label" x="525" y="548" fill="#92400e" text-anchor="middle">Tool Modalities</text>
    <text class="small" x="525" y="570" text-anchor="middle">JSON tools, Skills, CLI-as-tool, Python code execution</text>
  </g>

  <g filter="url(#shadow)">
    <rect class="node" x="855" y="270" width="126" height="60" rx="10" stroke="#0284c7"/>
    <text class="label" x="918" y="295" text-anchor="middle">Evaluator</text>
    <text class="small" x="918" y="314" text-anchor="middle">default-fail gate</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1022" y="270" width="118" height="60" rx="10" fill="#be185d"/>
    <text x="1081" y="294" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">Publish</text>
    <text x="1081" y="313" font-size="11" fill="#fce7f3" text-anchor="middle">HITL interrupt</text>
  </g>

  <line x1="134" y1="300" x2="165" y2="300" stroke="#64748b" stroke-width="2.5"/>
  <polygon points="165,300 155,295 155,305" fill="#64748b"/>
  <line x1="274" y1="286" x2="300" y2="175" stroke="#7c3aed" stroke-width="2.5"/>
  <polygon points="300,175 288,170 291,182" fill="#7c3aed"/>
  <text class="tiny" x="296" y="143" fill="#6d28d9">deep mode</text>
  <line x1="274" y1="314" x2="300" y2="415" stroke="#0f766e" stroke-width="2.5"/>
  <polygon points="300,415 289,408 288,421" fill="#0f766e"/>
  <text class="tiny" x="296" y="468" fill="#0f766e">flash mode</text>

  <line x1="423" y1="175" x2="471" y2="175" stroke="#7c3aed" stroke-width="2.5"/>
  <polygon points="471,175 461,170 461,180" fill="#7c3aed"/>
  <line x1="594" y1="175" x2="642" y2="175" stroke="#7c3aed" stroke-width="2.5"/>
  <polygon points="642,175 632,170 632,180" fill="#7c3aed"/>
  <line x1="535" y1="204" x2="535" y2="247" stroke="#7c3aed" stroke-width="2.5"/>
  <line x1="560" y1="247" x2="560" y2="204" stroke="#7c3aed" stroke-width="2.5"/>
  <polygon points="560,204 555,214 565,214" fill="#7c3aed"/>
  <text class="tiny" x="551" y="236" fill="#6d28d9">loop until plan complete</text>

  <line x1="423" y1="415" x2="471" y2="415" stroke="#0f766e" stroke-width="2.5"/>
  <polygon points="471,415 461,410 461,420" fill="#0f766e"/>
  <line x1="594" y1="415" x2="642" y2="415" stroke="#0f766e" stroke-width="2.5"/>
  <polygon points="642,415 632,410 632,420" fill="#0f766e"/>

  <line x1="500" y1="444" x2="500" y2="515" stroke="#d97706" stroke-width="2.5" stroke-dasharray="7 5"/>
  <polygon points="500,515 495,505 505,505" fill="#d97706"/>
  <text class="tiny" x="553" y="482" fill="#92400e">parallel tool batch</text>

  <line x1="765" y1="175" x2="850" y2="291" stroke="#64748b" stroke-width="2.5"/>
  <polygon points="850,291 839,285 837,297" fill="#64748b"/>
  <line x1="765" y1="415" x2="850" y2="309" stroke="#64748b" stroke-width="2.5"/>
  <polygon points="850,309 837,313 840,301" fill="#64748b"/>
  <line x1="981" y1="300" x2="1017" y2="300" stroke="#be185d" stroke-width="2.5" stroke-dasharray="7 5"/>
  <polygon points="1017,300 1007,295 1007,305" fill="#be185d"/>
  <text class="tiny" x="1001" y="288" fill="#be185d" text-anchor="middle">interrupt_before</text>

  <g transform="translate(42 608)">
    <rect x="0" y="-12" width="14" height="14" rx="3" fill="#f5f3ff" stroke="#8b5cf6"/>
    <text class="tiny" x="22" y="0">ReAct path</text>
    <rect x="105" y="-12" width="14" height="14" rx="3" fill="#ecfdf5" stroke="#14b8a6"/>
    <text class="tiny" x="127" y="0">ReWOO path</text>
    <rect x="214" y="-12" width="14" height="14" rx="3" fill="#fffbeb" stroke="#f59e0b"/>
    <text class="tiny" x="236" y="0">Shared tool surface</text>
    <rect x="365" y="-12" width="14" height="14" rx="3" fill="#be185d"/>
    <text class="tiny" x="387" y="0">Human approval before publish</text>
  </g>
</svg>
