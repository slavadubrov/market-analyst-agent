services:
  # PostgreSQL for checkpoint persistence
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-market_analyst}
      POSTGRES_USER: ${POSTGRES_USER:-analyst}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-analyst_pass}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Qdrant for Long-Term Memory (Vector DB)
  qdrant:
    image: qdrant/qdrant:v1.18.0
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/tcp/localhost/6333'"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis for alternative hot memory checkpointer
  redis:
    image: redis/redis-stack-server:7.4.0-v8
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Market Analyst Agent application
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file:
      - path: ../.env
        required: false
    environment:
      # Service discovery for docker-compose network
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://redis:6379
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      # Database credentials inherited from .env or use defaults
      - POSTGRES_DB=${POSTGRES_DB:-market_analyst}
      - POSTGRES_USER=${POSTGRES_USER:-analyst}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-analyst_pass}
    ports:
      - "127.0.0.1:7860:7860"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    # Override for one-shot analysis:
    # command: ["python", "-m", "market_analyst.cli", "Analyze NVDA stock"]

volumes:
  postgres_data:

  qdrant_data:

  redis_data:
