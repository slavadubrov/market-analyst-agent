services:
  # PostgreSQL for checkpoint persistence
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-market_analyst}
      POSTGRES_USER: ${POSTGRES_USER:-analyst}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-analyst_pass}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Qdrant for Long-Term Memory (Vector DB)
  qdrant:
    image: qdrant/qdrant:v1.18.0
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/tcp/localhost/6333'"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis for alternative hot memory checkpointer + Redis Streams queue.
  redis:
    image: redis/redis-stack-server:7.4.0-v8
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Market Analyst Agent application
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file:
      - path: ../.env
        required: false
    environment:
      # Service discovery for docker-compose network
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://redis:6379
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      # Database credentials inherited from .env or use defaults
      - POSTGRES_DB=${POSTGRES_DB:-market_analyst}
      - POSTGRES_USER=${POSTGRES_USER:-analyst}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-analyst_pass}
      # OTel + metrics (Part 5: The Habitat). Both blank by default so a
      # plain `docker compose up` doesn't depend on the observability stack.
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-market-analyst-agent}
      - METRICS_ENABLED=${METRICS_ENABLED:-false}
      - METRICS_PORT=${METRICS_PORT:-9464}
    ports:
      - "127.0.0.1:7860:7860"
      - "127.0.0.1:9464:9464"  # Prometheus /metrics (gated on METRICS_ENABLED=true)
    volumes:
      # Per-thread workspaces (PROGRESS.md, debug bundles).
      - workspaces_data:/app/workspaces
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    # Override for one-shot analysis:
    # command: ["python", "-m", "market_analyst.cli", "Analyze NVDA stock"]

  # ---- MCP sidecar (Part 5: The Habitat) -------------------------------
  # Exposes the data tools (stock, news, etc.) over MCP. The article's
  # Optional server for external clients. The worker uses local tools;
  # this is not a secret broker or an isolation boundary.
  # Opt in with `docker compose --profile mcp up`.
  mcp-sidecar:
    profiles: ["mcp"]
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file:
      - ../.env
    command: ["python", "-m", "market_analyst.mcp_server"]
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      - MCP_PORT=8765
      - MCP_TRANSPORT=http

  # ---- Observability stack (Part 5: The Habitat) -----------------------
  # `docker compose --profile observability up` brings up OTel Collector,
  # Tempo, Loki, Prometheus, and Grafana. Grafana ships preconfigured
  # datasources and a starter dashboard keyed on gen_ai.agent.name.
  otel-collector:
    profiles: ["observability"]
    image: otel/opentelemetry-collector-contrib:0.117.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"  # OTLP gRPC
      - "127.0.0.1:4318:4318"  # OTLP HTTP
      - "127.0.0.1:8888:8888"  # Collector self-metrics
    depends_on:
      - tempo

  tempo:
    profiles: ["observability"]
    image: grafana/tempo:2.7.0
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - "127.0.0.1:3200:3200"

  loki:
    profiles: ["observability"]
    image: grafana/loki:3.3.0
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ./observability/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    ports:
      - "127.0.0.1:3100:3100"

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v3.0.1
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=14d"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:11.4.0
    environment:
      # Anonymous admin is OK in dev; the article calls this out as one of
      # the eight production deltas — replace with OAuth/SAML in prod.
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
      - tempo
      - loki

volumes:
  postgres_data:
  qdrant_data:
  redis_data:
  workspaces_data:
  tempo_data:
  loki_data:
  prometheus_data:
  grafana_data:
